name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: Linux (сборка, тесты, эталоны)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: fontTools для эталонов шрифтов
        run: python -m pip install --quiet fonttools==4.60.1
      - name: Эталоны совпадают с оригиналом
        run: python tools/gen_golden.py --check
      # apt на раннерах изредка зависает на зеркале: таймауты сети, до трёх попыток с ограничением по времени,
      # без пересборки справки man-db (она одна может занимать минуты)
      - name: ffmpeg и MKVToolNix для интеграционных тестов
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do
            sudo dpkg --configure -a || true
            if sudo timeout 180 apt-get $apt_opts update -q \
              && sudo timeout 420 apt-get $apt_opts install -y -q --no-install-recommends ffmpeg mkvtoolnix; then
              exit 0
            fi
            echo "Попытка $i не удалась"
            sleep $((20 * i))
          done
          exit 1
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
        env:
          ANITOOLS_REQUIRE_TOOLS: 1  # интеграционные тесты не пропускаются, а падают, если программ нет
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: artifacts/screenshots
          if-no-files-found: ignore

  windows:
    name: Windows (сборка, тесты)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Как у пользователя: ffmpeg через Chocolatey (шим в chocolatey\bin), MKVToolNix в Program Files.
      # Репозиторий Chocolatey иногда отвечает 504 — три попытки. Поставились — интеграционные тесты обязательны
      # (ANITOOLS_REQUIRE_TOOLS), нет — пропускаются с заметным предупреждением, сборка не падает.
      - name: ffmpeg и MKVToolNix для интеграционных тестов
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg mkvtoolnix -y --no-progress
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Test-Path "$env:ProgramFiles\MKVToolNix\mkvmerge.exe")) {
              "ANITOOLS_REQUIRE_TOOLS=1" >> $env:GITHUB_ENV
              exit 0
            }
            Write-Host "Попытка $i не удалась"
            Start-Sleep -Seconds (30 * $i)
          }
          Write-Host "::warning::ffmpeg/MKVToolNix не поставились через Chocolatey — интеграционные тесты на Windows пропущены"
          exit 1
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: artifacts/screenshots
          if-no-files-found: ignore
      # Готовый Anitools.exe (один файл, .NET внутри) — скачать из «Artifacts» и проверить у себя (docs/WINDOWS.md).
      # Флаги как в tools/windows/publish.ps1: ReadyToRun и без сжатия — быстрый запуск.
      - name: Сборка Anitools.exe
        run: >-
          dotnet publish src/Anitools.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:DebugType=none -o artifacts/publish
      - uses: actions/upload-artifact@v7
        with:
          name: anitools-win-x64
          path: artifacts/publish/Anitools.exe
          retention-days: 30
      # Установщик (installer/anitools.iss) и его проверка на чистой Windows: тихая установка, команда ani из cmd
      # и PowerShell (окно открывается в текущей папке, консоль закрывается сама), удаление.
      - name: Inno Setup
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco upgrade innosetup -y --no-progress
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1
      - name: Сборка установщика
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\anitools.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка установщика и команды ani
        shell: pwsh
        run: ./tools/windows/test-installer.ps1 -Setup artifacts/installer/anitools-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: anitools-setup
          path: artifacts/installer/anitools-setup.exe
          retention-days: 30
